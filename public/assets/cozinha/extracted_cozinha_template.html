    <button style="flex: 1; min-height: 44px; border-radius: 6px; border: 1px solid #6b5236; background: rgba(30,20,12,.88); color: #b9a47e; font-family: Cinzel, serif; font-weight: 700; font-size: 14px">Alquimia</button>
    <button style="flex: 1; min-height: 44px; border-radius: 6px; border: 2px solid #e8a33a; background: #4a2a0c; color: #ffe7b0; font-family: Cinzel, serif; font-weight: 800; font-size: 14px; box-shadow: 0 0 14px rgba(255,170,60,.35)">Cozinha</button>
  </div>

  <div style="position: absolute; top: 66px; left: 12px; right: 12px; display: flex; justify-content: center; align-items: center; gap: 10px">
    <button aria-label="Livro de Receitas" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #9a6a2a; background: rgba(26,16,8,.9); color: #f5d99a; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5 Q4 3 6 3 L19 3 L19 19 L6 19 Q4 19 4 21 Z"></path><path d="M4 21 Q4 19 6 19"></path><path d="M15 3 L15 10 L13 8.5 L11 10 L11 3"></path></svg>
    </button>
    <span style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #a8642a; background: rgba(20,12,6,.88); color: #ffb36b; font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center">
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 Q18 9 17 15 A5 5 0 0 1 7 15 Q6 11 10 8 Q10 12 12 12 Q11 7 12 3 Z"></path></svg>
      Fogo alto
    </span>
    <span aria-label="Panela e espeto: OK" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #4f7a3a; background: rgba(20,30,14,.9); color: #b6dc96; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3 L15 3"></path><path d="M10 3 L10 9 L5 18 Q4 21 7 21 L17 21 Q20 21 19 18 L14 9 L14 3"></path></svg>
    </span>
  </div>

  <div style="position: absolute; top: 120px; left: 55px; width: 280px; height: 322px">
    <img src="9e5ad59d-872d-4609-a5ab-c7c8eff00a04" alt="" style="position: absolute; left: 0; bottom: 0; width: 280px; filter: drop-shadow(0 0 22px rgba(255,140,40,.35))">
    <div style="position: absolute; left: 20%; top: 0; width: 60%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3%; filter: drop-shadow(0 8px 12px rgba(0,0,0,.75))">
      <sc-for list="{{ grade }}" as="s" hint-placeholder-count="9">
        <div style="position: relative; aspect-ratio: 1">
          <img src="{{ s.img }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain">
          <sc-if value="{{ s.tem }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; inset: 20%">
              <dc-import name="Icone" tipo="{{ s.tipo }}" cor="#fff3d6" hint-size="100%,100%"></dc-import>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; top: 448px; left: 20px; right: 20px; display: flex; gap: 10px; align-items: center; background: rgba(14,9,6,.84); border: 1px solid #6b4a28; border-radius: 8px; padding: 6px 10px">
    <div style="position: relative; width: 84px; height: 90px; flex-shrink: 0">
      <div style="position: absolute; left: 21%; right: 21.5%; top: 24.2%; bottom: 22.2%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #f2a63a 0%, #2a1606 75%)">
        <div style="position: absolute; inset: 14%">
          <dc-import name="Icone" tipo="carne" cor="#fff6e0" hint-size="100%,100%"></dc-import>
        </div>
      </div>
      <img src="abc7d513-c933-4c8a-99ca-47cf4ce5e7f6" alt="" style="position: absolute; inset: 0; width: 84px; height: 90px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <span style="font-size: 11px; font-weight: 700; color: #f0b860; display: flex; gap: 4px; align-items: center">
        <svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 L10 17 L19 7"></path></svg>
        RECEITA DO LIVRO
      </span>
      <span style="font-family: Cinzel, serif; font-weight: 800; font-size: 17px; line-height: 1.15; color: #fff0cc">Ensopado de Javali-Brasa</span>
      <span style="font-size: 13px; line-height: 1.25; color: #efdcb8">+1 em Corpo e resistência a Queimando</span>

    </div>

    </span>

            </div>
            <span style="position: absolute; right: 7px; bottom: 4px; font-size: 11px; font-weight: 700; color: #f3dfae">{{ m.qtd }}</span>
