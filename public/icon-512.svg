<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="70%" stop-color="#120e0b"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a0"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#805b10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  
  <!-- Medieval Cross / Sword / Fleur Emblems -->
  <g transform="translate(256,256) scale(1.4)" filter="url(#glow)">
    <!-- Central Dagger/Sword -->
    <path d="M-8,-110 L8,-110 L5,20 L15,25 L15,35 L5,35 L4,95 L-4,95 L-5,35 L-15,35 L-15,25 L-5,20 Z" fill="url(#gold)"/>
    <!-- Guard -->
    <rect x="-45" y="20" width="90" height="10" rx="3" fill="url(#gold)"/>
    <circle cx="-45" cy="25" r="7" fill="url(#gold)"/>
    <circle cx="45" cy="25" r="7" fill="url(#gold)"/>
    <circle cx="0" cy="105" r="10" fill="url(#gold)"/>

    <!-- Flourishes / Wings -->
    <path d="M-25,-10 C-60,-40 -70,-90 -20,-75 C-35,-60 -30,-30 -12,-5 Z" fill="url(#gold)" opacity="0.85"/>
    <path d="M25,-10 C60,-40 70,-90 20,-75 C35,-60 30,-30 12,-5 Z" fill="url(#gold)" opacity="0.85"/>
  </g>
</svg>
